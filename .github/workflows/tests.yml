name: Engine tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core ffmpeg poppler-utils
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
